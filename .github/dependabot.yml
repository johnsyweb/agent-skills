version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - dependencies
