# paranoid: true also sets strictStoreIntegrity, which fails this tree:
# semantic-release → npm → @npmcli/* packuments have no dist.integrity.
jailBuilds: true
trustPolicy: no-downgrade
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
strictDepBuilds: true
advisoryCheck: required
packageManagerStrictVersion: true
allowBuilds: {}
